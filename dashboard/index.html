<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cell Tower Health</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>body{font-family:system-ui;margin:2rem;background:#0f172a;color:#e2e8f0}
canvas{max-width:800px;margin:2rem 0}table{border-collapse:collapse}
td,th{border:1px solid #334155;padding:6px 10px}</style>
</head>
<body>
<h2>Cell Tower Health Dashboard</h2>
<canvas id="utilChart"></canvas>
<h3>Chronic Offenders (&gt;10 days above 5% drop rate)</h3>
<table id="chronicTable"></table>

<script>
fetch('data.json').then(r => r.json()).then(d => {
  new Chart(document.getElementById('utilChart'), {
    type: 'line',
    data: { labels: d.util_drop.map(x => x.util_bucket),
      datasets: [{ label: 'Drop % vs Utilisation', data: d.util_drop.map(x => x.drop_pct) }] }
  });
  const t = document.getElementById('chronicTable');
  t.innerHTML = '<tr><th>Tower</th><th>Days &gt;5%</th></tr>' +
    d.chronic_towers.map(x => `<tr><td>${x.tower_id}</td><td>${x.days_over_5pct}</td></tr>`).join('');
});
</script>
</body>
</html>
